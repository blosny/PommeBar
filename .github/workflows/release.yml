name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Publish Self-Contained Win-x64 Release
        run: dotnet publish -c Release -r win-x64 --self-contained true -o ./publish

      - name: Package Release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./PommeBar-win-x64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PommeBar-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
